<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>pomeloCart Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { margin-right: 5px; }
    pre { background: #f5f5f5; padding: 10px; }
  </style>
</head>
<body>
  <h1>pomeloCart Demo</h1>
  <div>
    <button onclick="addItemA()">Add Item A</button>
    <button onclick="addItemB()">Add Item B</button>
    <button onclick="clearCart()">Clear Cart</button>
  </div>
  <h2>Cart Items</h2>
  <pre id="items"></pre>
  <h2>Summary</h2>
  <pre id="summary"></pre>

  <script src="pcart.js"></script>
  <script>
    const cart = new pomeloCart();

    function addItemA() {
      cart.addItem({ id: 'a1', price: 100, quantity: 1 });
      render();
    }

    function addItemB() {
      cart.addItem({ id: 'b1', price: 50, quantity: 1 });
      render();
    }

    function clearCart() {
      cart.empty();
      render();
    }

    function render() {
      document.getElementById('items').textContent = JSON.stringify(cart.list(), null, 2);
      document.getElementById('summary').textContent = JSON.stringify(cart.total(), null, 2);
    }

    render();
  </script>
</body>
</html>
